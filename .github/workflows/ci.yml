name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      # Exact lockfile install + workspace allowBuilds for esbuild/mongodb-memory-server.
      - run: pnpm install --frozen-lockfile
      # Surface production dependency advisories in logs without failing PR builds.
      - name: Security audit (non-blocking)
        run: pnpm audit --prod
        continue-on-error: true
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: mobile/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Surface production dependency advisories in logs without failing PR builds.
      - name: Security audit (non-blocking)
        run: pnpm audit --prod
        continue-on-error: true
      - run: pnpm lint
      - run: pnpm format:check
